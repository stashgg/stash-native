<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stash Pay - Test Checkout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #15171c 0%, #0d0e12 100%);
    color: #f2f3f5; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #ff5c39, #ff8f39);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #fff;
  }
  .brand span { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .card {
    width: 100%; max-width: 360px; background: #1d2027;
    border: 1px solid #2c3039; border-radius: 14px; padding: 20px;
  }
  .item { display: flex; align-items: center; gap: 14px; }
  .item .icon {
    width: 54px; height: 54px; border-radius: 12px;
    background: linear-gradient(135deg, #4e5dfb, #9b4efb);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .item h2 { font-size: 16px; }
  .item p { font-size: 13px; color: #9aa1ad; margin-top: 2px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; color: #9aa1ad; margin-top: 18px; }
  .row.total { color: #f2f3f5; font-weight: 700; font-size: 16px; border-top: 1px solid #2c3039; padding-top: 12px; margin-top: 12px; }
  button.pay {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, #ff5c39, #ff8f39);
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: opacity .15s ease;
  }
  button.pay:disabled { opacity: .55; cursor: default; }
  .alt { margin-top: 14px; text-align: center; font-size: 13px; }
  .alt a { color: #8b93a1; cursor: pointer; text-decoration: underline; }
  .state { margin-top: 18px; text-align: center; font-size: 14px; min-height: 42px; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid #3a3f4a; border-top-color: #ff7b39;
    border-radius: 50%; margin: 0 auto 8px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { font-size: 30px; color: #4ade80; }
  .cross { font-size: 30px; color: #f87171; }
  footer { margin-top: auto; padding-top: 24px; font-size: 12px; color: #6b7280; text-align: center; }
</style>
</head>
<body>
  <div class="brand"><div class="logo">S</div><span>Stash Pay</span></div>

  <div class="card">
    <div class="item">
      <div class="icon">S</div>
      <div>
        <h2>Pouch of Gems x500</h2>
        <p>Offline test item</p>
      </div>
    </div>
    <div class="row"><span>Subtotal</span><span>$0.99</span></div>
    <div class="row"><span>Tax</span><span>$0.00</span></div>
    <div class="row total"><span>Total</span><span>$0.99 USD</span></div>
    <button class="pay" id="pay">Pay $0.99</button>
    <div class="alt"><a id="fail">Simulate declined payment</a></div>
    <div class="state" id="state"></div>
  </div>

  <footer>Offline simulation, no real charge.<br>Callbacks flow through window.stash_sdk into the native host.</footer>

<script>
  const state = document.getElementById('state');
  const payBtn = document.getElementById('pay');

  // The production contract: window.stash_sdk, injected by the SDK (mobile and desktop alike).
  // Outside an SDK webview the calls are logged so the page still works in a browser tab.
  function send(handler, data) {
    const sdk = window.stash_sdk;
    if (sdk) {
      if (handler === 'stashPurchaseProcessing') return sdk.onPurchaseProcessing(data);
      if (handler === 'stashPaymentSuccess') return sdk.onPaymentSuccess(data);
      if (handler === 'stashPaymentFailure') return sdk.onPaymentFailure(data);
    }
    console.log('stash_sdk unavailable (browser test)', handler, data);
  }

  function pay() {
    payBtn.disabled = true;
    state.innerHTML = '<div class="spinner"></div>Processing payment...';
    send('stashPurchaseProcessing', { stage: 'authorizing' });
    setTimeout(() => {
      state.innerHTML = '<div class="check">&#10003;</div>Payment complete';
      send('stashPaymentSuccess', {
        orderId: 'order_proto_12345',
        itemId: 'gems_500',
        amount: '0.99',
        currency: 'USD',
        source: 'stash_test_checkout'
      });
    }, 900);
  }

  function fail() {
    payBtn.disabled = true;
    state.innerHTML = '<div class="cross">&#10005;</div>Payment declined';
    send('stashPaymentFailure', { reason: 'card_declined_test' });
  }

  payBtn.addEventListener('click', pay);
  document.getElementById('fail').addEventListener('click', fail);

  // ?auto=1 or #auto: hands-free proof run, clicks Pay shortly after load.
  if (new URLSearchParams(location.search).get('auto') === '1' || location.hash.includes('auto')) {
    setTimeout(pay, 1200);
  }
</script>
</body>
</html>
