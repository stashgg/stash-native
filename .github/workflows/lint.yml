name: Lint

on:
  workflow_call:
    inputs:
      ios-runner:
        type: string
        default: macos-26
      xcode-version:
        type: string
        default: '26.6'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-android-library:
    name: Lint Android Library (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar

      - name: Run Checkstyle on Library
        run: |
          java -jar checkstyle.jar -c Android/checkstyle.xml \
            -f plain \
            Android/stashnative/src/main/java/ \
            Android/stashnative-codelink/src/main/java/

  lint-android-sample:
    name: Lint Android Sample (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar

      - name: Run Checkstyle on Sample
        run: |
          java -jar checkstyle.jar -c Android/checkstyle.xml \
            -f plain \
            Android/sample/src/main/java/

  test-android:
    name: Test Android Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run unit tests and build samples
        run: cd Android && ./gradlew :stashnative:testDebugUnitTest :stashnative-codelink:testDebugUnitTest :sample:testDebugUnitTest :sample:assembleDebug :sample:assembleRelease

      - name: Android Lint
        run: cd Android && ./gradlew :stashnative:lintRelease :stashnative-codelink:lintRelease :sample:lintDebug

      - name: Build minimal Java AAR consumers with R8
        run: cd Android && ./gradlew :consumer:assembleCurrentRelease :consumer:assembleLegacyRelease :consumer:assembleAbsentRelease :consumer:assembleCameraOnlyRelease :consumer:assembleLegacyCameraRelease

      - name: Upload Android test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            Android/stashnative/build/test-results/
            Android/stashnative-codelink/build/test-results/
            Android/sample/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-ios:
    name: Test iOS Library
    runs-on: ${{ inputs.ios-runner || 'macos-26' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.6' }}

      - name: Test sample request and credential handling
        run: HS_TEMP="$RUNNER_TEMP" python3 iOS/Sample/Tests/run_regressions.py --output "$RUNNER_TEMP/stash-sample-regressions"

      - name: Build root Swift package for iOS Simulator
        # The repository-root manifest is what remote SPM consumers resolve; keep it building.
        run: |
          PKG=$(mktemp -d "${RUNNER_TEMP}/stash-root-package.XXXXXX")
          cp Package.swift "$PKG/" && cp -R iOS "$PKG/"
          cd "$PKG"
          set -o pipefail
          xcodebuild -scheme StashNative \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/stash-root-package-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/stash-root-package-clones" \
            build 2>&1 | tail -5

      - name: Run unit tests
        run: |
          TEST_SOURCE=$(mktemp -d "${RUNNER_TEMP}/stash-ios-tests.XXXXXX")
          cp -R iOS/StashNative/Sources iOS/StashNative/Tests \
            iOS/StashNative/StashNative.xcodeproj iOS/StashNative/Info.plist "$TEST_SOURCE/"
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs = json.load(sys.stdin)['devices']
          for rt,dl in devs.items():
            if 'iOS' in rt:
              for d in dl:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['udid']); sys.exit(0)
          sys.exit(1)")
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test \
            -project "$TEST_SOURCE/StashNative.xcodeproj" \
            -scheme StashNativeTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/stash-ios-tests-derived" \
            -resultBundlePath "$RUNNER_TEMP/stash-ios-tests.xcresult"

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ inputs.xcode-version || '26.6' }}
          path: ${{ runner.temp }}/stash-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  lint-ios-library:
    name: Lint iOS Library (Clang Static Analyzer)
    runs-on: ${{ inputs.ios-runner || 'macos-26' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.6' }}

      - name: Run Static Analysis on iOS Library
        run: |
          # Run Clang Static Analyzer on Objective-C library (generic destination works on any runner)
          cd iOS/StashNative
          for SCHEME in StashNative StashNativeCodeLink; do
            xcodebuild analyze \
              -project StashNative.xcodeproj \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/stash-ios-analysis" \
              GCC_TREAT_WARNINGS_AS_ERRORS=YES \
              CLANG_ANALYZER_OUTPUT=plist-html \
              CLANG_ANALYZER_OUTPUT_DIR="$RUNNER_TEMP/stash-ios-analyzer-results"
          done
        continue-on-error: false

      - name: Build non-ARC library
        run: |
          xcodebuild build \
            -project iOS/StashNative/StashNative.xcodeproj \
            -scheme StashNative \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/stash-ios-non-arc" \
            CLANG_ENABLE_OBJC_ARC=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

  lint-ios-sample:
    name: Lint iOS Sample (SwiftLint)
    runs-on: ${{ inputs.ios-runner || 'macos-26' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.6' }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on Sample
        run: |
          swiftlint lint iOS/Sample/StashNativeSample --strict --config .swiftlint.yml
        continue-on-error: false
