name: BrowserStack E2E

# Manual only for now. Builds a sample app, uploads it to BrowserStack App
# Automate, runs the Appium specs, and uploads the screenshots.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to test
        type: choice
        options: [both, android, ios]
        default: both

jobs:
  android:
    name: Android E2E
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build sample debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :stashnative:assembleRelease :sample:assembleDebug

      - name: Upload APK to BrowserStack
        id: upload
        run: |
          APK=$(find Android/sample/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Uploading $APK"
          RESPONSE=$(curl -s -u "${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$APK")
          echo "$RESPONSE"
          APP_ID=$(echo "$RESPONSE" | jq -r .app_url)
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Android specs
        working-directory: e2e/browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ steps.upload.outputs.app_id }}
          BROWSERSTACK_BUILD_NAME: android-${{ github.run_id }}
        run: |
          npm install
          npm run test:android

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: e2e/browserstack/artifacts/screenshots
          if-no-files-found: ignore

  ios:
    name: iOS E2E
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build sample for device and package IPA
        working-directory: iOS/Sample/StashNativeSample
        run: |
          xcodebuild clean build \
            -project StashNativeSample.xcodeproj \
            -scheme StashNativeSample \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP="build/DerivedData/Build/Products/Release-iphoneos/StashNativeSample.app"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          (cd build && zip -qr StashNativeSample.ipa Payload)

      - name: Upload IPA to BrowserStack
        id: upload
        run: |
          IPA="iOS/Sample/StashNativeSample/build/StashNativeSample.ipa"
          echo "Uploading $IPA"
          RESPONSE=$(curl -s -u "${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$IPA")
          echo "$RESPONSE"
          APP_ID=$(echo "$RESPONSE" | jq -r .app_url)
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run iOS specs
        working-directory: e2e/browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ steps.upload.outputs.app_id }}
          BROWSERSTACK_BUILD_NAME: ios-${{ github.run_id }}
        run: |
          npm install
          npm run test:ios

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: e2e/browserstack/artifacts/screenshots
          if-no-files-found: ignore
