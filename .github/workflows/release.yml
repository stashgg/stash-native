name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: false
        type: string
      changelog:
        description: 'Optional changelog for this release (Markdown supported)'
        required: false
        type: string

jobs:
  build-android:
    name: Build Android AAR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew
      
      - name: Build Android AAR
        working-directory: Android
        run: ./gradlew :stashnative:assembleRelease
      
      - name: Find AAR file
        id: find-aar
        run: |
          AAR_PATH=$(find Android/stashnative/build/outputs/aar -name "*.aar" -type f | head -1)
          if [ -z "$AAR_PATH" ]; then
            echo "AAR not found!"
            find Android/stashnative/build/outputs -name "*.aar" || true
            exit 1
          fi
          echo "Found AAR at: $AAR_PATH"
          echo "aar_path=$AAR_PATH" >> $GITHUB_OUTPUT
      
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: stashnative-android-aar
          path: ${{ steps.find-aar.outputs.aar_path }}
          retention-days: 7

  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify iPhoneOS SDK is not 26.x
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK version: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -ge 26 ]; then
            echo "ERROR: Expected iphoneos SDK < 26 (use macos-15 + Xcode 16.x). Got $SDK"
            exit 1
          fi

      - name: Build XCFramework
        run: |
          cd iOS/StashNative
          
          # Create build directory
          mkdir -p build
          
          # Archive for iOS device
          echo "Building for iOS device..."
          xcodebuild archive \
            -project StashNative.xcodeproj \
            -scheme StashNative \
            -destination 'generic/platform=iOS' \
            -archivePath build/StashNative-iOS.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
          # Archive for iOS Simulator
          echo "Building for iOS Simulator..."
          xcodebuild archive \
            -project StashNative.xcodeproj \
            -scheme StashNative \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath build/StashNative-Sim.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
          # Create XCFramework
          echo "Creating XCFramework..."
          xcodebuild -create-xcframework \
            -framework "build/StashNative-iOS.xcarchive/Products/Library/Frameworks/StashNative.framework" \
            -framework "build/StashNative-Sim.xcarchive/Products/Library/Frameworks/StashNative.framework" \
            -output build/StashNative.xcframework
          
          # Verify XCFramework was created
          if [ ! -d "build/StashNative.xcframework" ]; then
            echo "Failed to create XCFramework"
            exit 1
          fi
          
          echo "XCFramework created successfully"
          ls -la build/StashNative.xcframework
      
      - name: Zip XCFramework
        run: |
          cd iOS/StashNative/build
          zip -r StashNative.xcframework.zip StashNative.xcframework
          echo "Created StashNative.xcframework.zip"
          ls -la StashNative.xcframework.zip
      
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: stashnative-ios-xcframework
          path: iOS/StashNative/build/StashNative.xcframework.zip
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Android AAR
        uses: actions/download-artifact@v4
        with:
          name: stashnative-android-aar
          path: release-artifacts
      
      - name: Download iOS XCFramework
        uses: actions/download-artifact@v4
        with:
          name: stashnative-ios-xcframework
          path: release-artifacts
      
      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/
      
      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"
      
      - name: Rename artifacts with version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cd release-artifacts
          
          # Rename AAR
          AAR_FILE=$(find . -name "*.aar" | head -1)
          if [ -n "$AAR_FILE" ]; then
            mv "$AAR_FILE" "StashNative-${TAG}.aar"
          fi
          
          # Rename XCFramework zip
          if [ -f "StashNative.xcframework.zip" ]; then
            mv "StashNative.xcframework.zip" "StashNative-${TAG}.xcframework.zip"
          fi
          
          echo "Renamed artifacts:"
          ls -la
      
      - name: Prepare release body
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Optional changelog (only when run manually with changelog input)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.changelog }}" ]; then
            {
              echo "## What's changed"
              echo ""
              printf '%s\n' "${{ inputs.changelog }}"
              echo ""
              echo "---"
              echo ""
            } >> release_body.md
          fi
          # Default release notes (no leading spaces so markdown renders correctly)
          {
            echo "## StashNative SDK ${TAG}"
            echo ""
            echo "### Android"
            echo "Download \`StashNative-${TAG}.aar\` and add to your project's \`libs\` folder."
            echo ""
            echo "\`\`\`groovy"
            echo "dependencies {"
            echo "    implementation files('libs/StashNative-${TAG}.aar')"
            echo "    implementation 'androidx.appcompat:appcompat:1.6.1'"
            echo "    implementation 'androidx.browser:browser:1.7.0'"
            echo "}"
            echo "\`\`\`"
            echo ""
            echo "### iOS"
            echo "Download \`StashNative-${TAG}.xcframework.zip\`, unzip, and add \`StashNative.xcframework\` to your Xcode project."
            echo ""
            echo "Alternatively, use Swift Package Manager with this repository URL."
          } >> release_body.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Stash Native ${{ steps.version.outputs.tag }}
          body_path: release_body.md
          files: |
            release-artifacts/StashNative-${{ steps.version.outputs.tag }}.aar
            release-artifacts/StashNative-${{ steps.version.outputs.tag }}.xcframework.zip
          draft: false
          prerelease: false
