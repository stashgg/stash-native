name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-android:
    name: Lint Android (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar
          curl -sL "https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-${CHECKSTYLE_VERSION}/src/main/resources/google_checks.xml" -o google_checks.xml

      - name: Run Checkstyle
        run: |
          java -jar checkstyle.jar -c google_checks.xml \
            -f plain \
            Android/stashpay/src/main/java/ \
            Android/sample/src/main/java/

  lint-ios:
    name: Lint iOS (SwiftLint)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --path iOS/Sample/StashPaySample --strict --config .swiftlint.yml
        continue-on-error: false
