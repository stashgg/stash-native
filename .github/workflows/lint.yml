name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-android-library:
    name: Lint Android Library (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar
          curl -sL "https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-${CHECKSTYLE_VERSION}/src/main/resources/google_checks.xml" -o google_checks.xml

      - name: Run Checkstyle on Library
        run: |
          java -jar checkstyle.jar -c google_checks.xml \
            -f plain \
            Android/stashpay/src/main/java/

  lint-android-sample:
    name: Lint Android Sample (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar
          curl -sL "https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-${CHECKSTYLE_VERSION}/src/main/resources/google_checks.xml" -o google_checks.xml

      - name: Run Checkstyle on Sample
        run: |
          java -jar checkstyle.jar -c google_checks.xml \
            -f plain \
            Android/sample/src/main/java/

  lint-ios-library:
    name: Lint iOS Library (Clang Static Analyzer)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Static Analysis on iOS Library
        run: |
          # Run Clang Static Analyzer on Objective-C library
          cd iOS/StashPay
          xcodebuild analyze \
            -project StashPay.xcodeproj \
            -scheme StashPay \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR=analyzer_results
        continue-on-error: false

  lint-ios-sample:
    name: Lint iOS Sample (SwiftLint)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on Sample
        run: |
          swiftlint lint iOS/Sample/StashPaySample --strict --config .swiftlint.yml
        continue-on-error: false
