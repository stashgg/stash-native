name: Build & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    # desktop/** so every PR of a stacked desktop branch set gets CI, not only the bottom one.
    branches: [ main, master, 'desktop/**' ]
  workflow_dispatch:

jobs:
  build-android-library:
    name: Build Android library only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew

      - name: Clean and build Android library (stashnative)
        working-directory: Android
        run: ./gradlew clean :stashnative:assembleRelease

  build-ios-library:
    name: Build iOS library only
    # macos-26 images only ship Xcode 26 (iOS 26 SDK). macos-15 includes Xcode 16.4 (iOS 18 SDK) for broad device support.
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify iPhoneOS SDK is not 26.x
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK version: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -ge 26 ]; then
            echo "ERROR: Expected iphoneos SDK < 26 (use macos-15 + Xcode 16.x). Got $SDK"
            exit 1
          fi

      - name: Clean and build iOS library (StashNative)
        working-directory: iOS/StashNative
        run: |
          xcodebuild clean build \
            -project StashNative.xcodeproj \
            -scheme StashNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  build-android:
    name: Build Android Sample APK
    runs-on: ubuntu-latest
    needs: [build-android-library]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew
      
      - name: Build Android library (stashnative)
        working-directory: Android
        run: ./gradlew :stashnative:assembleRelease
      
      - name: Build Android Sample APK
        working-directory: Android
        run: ./gradlew :sample:assembleRelease
      
      - name: Build Android Sample Debug APK (signed for Appetize)
        working-directory: Android
        run: ./gradlew :sample:assembleDebug
      
      - name: Find APK file
        id: find-apk
        run: |
          APK_PATH=$(find Android/sample/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find Android/sample/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK not found! Searching in Android/sample/build/outputs/apk:"
            ls -la Android/sample/build/outputs/apk/ || true
            find Android/sample/build/outputs -name "*.apk" || true
            exit 1
          fi
          echo "Found release APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sample-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 7
      
      - name: Upload APK to BrowserStack
        # Stacked desktop PRs build and test only; the shared BrowserStack / Appetize targets are
        # replaced from pushes and PRs to main, as before.
        if: ${{ !startsWith(github.base_ref, 'desktop/') }}
        id: browserstack-android
        run: |
          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          UPLOAD_NAME="StashNative_${SHORT_SHA}_${SAFE_BRANCH}.apk"
          cp "$APK_PATH" "/tmp/$UPLOAD_NAME"
          echo "Uploading APK to BrowserStack as: $UPLOAD_NAME"
          RESPONSE=$(curl -u "${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/$UPLOAD_NAME")
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "BrowserStack Android Upload Response:"
          echo "$RESPONSE"

      - name: Upload APK to Appetize
        # Stacked desktop PRs build and test only; the shared BrowserStack / Appetize targets are
        # replaced from pushes and PRs to main, as before.
        if: ${{ !startsWith(github.base_ref, 'desktop/') }}
        run: |
          # Appetize requires a signed APK; use debug build (signed with debug keystore)
          APK_PATH=$(find Android/sample/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found (Appetize requires signed APK)"
            exit 1
          fi
          echo "Uploading signed (debug) APK to Appetize (Android app id: b_3l3fzg5qiahx6p2xpwp3kcirhy)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.appetize.io/v1/apps/b_3l3fzg5qiahx6p2xpwp3kcirhy" \
            -H "X-API-KEY: ${{ secrets.APPETIZE_API_KEY }}" \
            -F "file=@$APK_PATH" \
            -F "platform=android" \
            -F "note=Commit: ${{ github.sha }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Appetize response status: $HTTP_CODE"
          echo "Appetize response body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Android sample uploaded successfully to Appetize"
          else
            echo "Failed to upload Android sample to Appetize (HTTP $HTTP_CODE)"
            exit 1
          fi

  build-ios:
    name: Build iOS Sample IPA
    runs-on: macos-15
    needs: [build-ios-library]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify iPhoneOS SDK is not 26.x
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK version: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -ge 26 ]; then
            echo "ERROR: Expected iphoneos SDK < 26 (use macos-15 + Xcode 16.x). Got $SDK"
            exit 1
          fi
      
      - name: Build iOS library (StashNative)
        working-directory: iOS/StashNative
        run: |
          xcodebuild build \
            -project StashNative.xcodeproj \
            -scheme StashNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Build iOS Sample for Device
        working-directory: iOS/Sample/StashNativeSample
        run: |
          xcodebuild clean build \
            -project StashNativeSample.xcodeproj \
            -scheme StashNativeSample \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify MinimumOSVersion and Mach-O minos in device build
        working-directory: iOS/Sample/StashNativeSample
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StashNativeSample.app"
          echo "App MinimumOSVersion:"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || echo "(missing)"
          FW_PLIST="$APP_PATH/Frameworks/StashNative.framework/Info.plist"
          if [ -f "$FW_PLIST" ]; then
            echo "StashNative.framework MinimumOSVersion:"
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$FW_PLIST" || echo "(missing)"
          fi
          echo "Mach-O LC_BUILD_VERSION (app + framework):"
          otool -l "$APP_PATH/StashNativeSample" | grep -A4 LC_BUILD_VERSION || true
          otool -l "$APP_PATH/Frameworks/StashNative.framework/StashNative" | grep -A4 LC_BUILD_VERSION || true
          check_minos() {
            path="$1"
            [ -f "$path" ] || return 0
            min=$(otool -l "$path" 2>/dev/null | awk '/LC_BUILD_VERSION/{getline;getline;getline; if($1=="minos"){print $2; exit}}')
            [ -z "$min" ] && return 0
            major="${min%%.*}"
            if [ "$major" -ge 26 ]; then
              echo "ERROR: minos $min (>=26) in $path"
              exit 1
            fi
            echo "OK minos $min in $path"
          }
          check_minos "$APP_PATH/StashNativeSample"
          check_minos "$APP_PATH/Frameworks/StashNative.framework/StashNative"
          for dylib in "$APP_PATH/Frameworks/"*.dylib; do
            [ -e "$dylib" ] || continue
            check_minos "$dylib"
          done
      
      - name: Create IPA
        working-directory: iOS/Sample/StashNativeSample
        run: |
          mkdir -p build/Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StashNativeSample.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            echo "Searching for app bundle:"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r StashNativeSample.ipa Payload
          cd ..
          if [ ! -f "build/StashNativeSample.ipa" ]; then
            echo "Error: IPA file was not created"
            exit 1
          fi
          echo "IPA created successfully at build/StashNativeSample.ipa"
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sample-ipa
          path: iOS/Sample/StashNativeSample/build/StashNativeSample.ipa
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload IPA to BrowserStack
        # Stacked desktop PRs build and test only; the shared BrowserStack / Appetize targets are
        # replaced from pushes and PRs to main, as before.
        if: ${{ !startsWith(github.base_ref, 'desktop/') }}
        id: browserstack-ios
        run: |
          IPA_PATH="iOS/Sample/StashNativeSample/build/StashNativeSample.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "Error: IPA file not found at $IPA_PATH"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          UPLOAD_NAME="StashNative_${SHORT_SHA}_${SAFE_BRANCH}.ipa"
          cp "$IPA_PATH" "/tmp/$UPLOAD_NAME"
          echo "Uploading IPA to BrowserStack as: $UPLOAD_NAME"
          RESPONSE=$(curl -u "${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/$UPLOAD_NAME")
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "BrowserStack iOS Upload Response:"
          echo "$RESPONSE"

      - name: Build iOS Sample for Simulator
        working-directory: iOS/Sample/StashNativeSample
        run: |
          xcodebuild build \
            -project StashNativeSample.xcodeproj \
            -scheme StashNativeSample \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create iOS Simulator zip
        working-directory: iOS/Sample/StashNativeSample
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/StashNativeSample.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Simulator app bundle not found at $APP_PATH"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi
          RUN_DIR=$(pwd)
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r ../../../../StashNativeSample-simulator.zip StashNativeSample.app
          cd "$RUN_DIR"
          if [ ! -f "build/StashNativeSample-simulator.zip" ]; then
            echo "Error: Simulator zip was not created"
            exit 1
          fi
          echo "Simulator zip created at build/StashNativeDemo-simulator.zip"

      - name: Upload iOS Simulator build to Appetize
        # Stacked desktop PRs build and test only; the shared BrowserStack / Appetize targets are
        # replaced from pushes and PRs to main, as before.
        if: ${{ !startsWith(github.base_ref, 'desktop/') }}
        run: |
          SIM_ZIP="iOS/Sample/StashNativeSample/build/StashNativeSample-simulator.zip"
          if [ ! -f "$SIM_ZIP" ]; then
            echo "Error: iOS simulator zip not found at $SIM_ZIP"
            exit 1
          fi
          echo "Uploading iOS simulator build to Appetize (iOS app id: b_qbywqclhrfl6lk3i3ehovfqa2m)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.appetize.io/v1/apps/b_qbywqclhrfl6lk3i3ehovfqa2m" \
            -H "X-API-KEY: ${{ secrets.APPETIZE_API_KEY }}" \
            -F "file=@$SIM_ZIP" \
            -F "platform=ios" \
            -F "note=Commit: ${{ github.sha }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Appetize response status: $HTTP_CODE"
          echo "Appetize response body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "iOS simulator sample uploaded successfully to Appetize"
          else
            echo "Failed to upload iOS simulator sample to Appetize (HTTP $HTTP_CODE)"
            exit 1
          fi

  build-macos-library:
    name: Build macOS desktop library only
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        working-directory: Desktop
        run: swift build -c release

      - name: Build bundle and verify exports
        run: Desktop/macOS/build_bundle.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-bundle
          path: Desktop/macOS/build/StashNativeDesktop.bundle
          retention-days: 7
          if-no-files-found: error

  build-macos-sample:
    name: Build macOS desktop sample
    runs-on: macos-15
    needs: [build-macos-library]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Universal, like the bundle: the arm64 runner alone would publish a binary Intel Macs
      # cannot run under an architecture-neutral artifact name.
      - name: Build sample (universal)
        working-directory: Desktop
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product StashNativeDesktopSample
          lipo -archs .build/apple/Products/Release/StashNativeDesktopSample

      - name: Run WKWebView smoke test (offline checkout page)
        working-directory: Desktop
        run: |
          set -o pipefail
          ./.build/apple/Products/Release/StashNativeDesktopSample -stash-auto local 2>&1 | tee smoke-local.log | grep STASH-PROOF
          grep -q "STASH-PROOF local: RESULT: PASS" smoke-local.log

      - name: Run navigation policy smoke test
        working-directory: Desktop
        run: |
          set -o pipefail
          ./.build/apple/Products/Release/StashNativeDesktopSample -stash-auto secure 2>&1 | tee smoke-secure.log | grep STASH-PROOF
          grep -q "STASH-PROOF secure: RESULT: PASS" smoke-secure.log

      # A tarball keeps the executable bit; upload-artifact alone normalizes modes to 0644.
      - name: Stage sample artifact
        run: |
          mkdir -p artifact/test-pages
          cp Desktop/.build/apple/Products/Release/StashNativeDesktopSample artifact/
          cp Desktop/shared/test-pages/* artifact/test-pages/
          tar -czf macos-desktop-sample.tar.gz -C artifact .

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-sample
          path: macos-desktop-sample.tar.gz
          retention-days: 7
