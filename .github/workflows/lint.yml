name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    # desktop/** so every PR of a stacked desktop branch set gets CI, not only the bottom one.
    branches: [ main, master, 'desktop/**' ]
  workflow_dispatch:

jobs:
  lint-android-library:
    name: Lint Android Library (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar

      - name: Run Checkstyle on Library
        run: |
          java -jar checkstyle.jar -c Android/checkstyle.xml \
            -f plain \
            Android/stashnative/src/main/java/

  lint-android-sample:
    name: Lint Android Sample (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Checkstyle
        run: |
          CHECKSTYLE_VERSION="10.12.7"
          curl -sL "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" -o checkstyle.jar

      - name: Run Checkstyle on Sample
        run: |
          java -jar checkstyle.jar -c Android/checkstyle.xml \
            -f plain \
            Android/sample/src/main/java/

  test-android:
    name: Test Android Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Run unit tests
        run: cd Android && ./gradlew :stashnative:testDebugUnitTest

      - name: Android Lint (non-blocking)
        continue-on-error: true
        run: cd Android && ./gradlew :stashnative:lintRelease

  test-ios:
    name: Test iOS Library
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          # Copy SPM package to a temp dir without .xcodeproj so xcodebuild
          # picks up the Package.swift test target instead of the project scheme.
          TMPDIR=$(mktemp -d)
          cp iOS/StashNative/Package.swift "$TMPDIR/"
          cp -r iOS/StashNative/Sources "$TMPDIR/"
          cp -r iOS/StashNative/Tests "$TMPDIR/"
          cd "$TMPDIR"
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs = json.load(sys.stdin)['devices']
          for rt,dl in devs.items():
            if 'iOS' in rt:
              for d in dl:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['udid']); sys.exit(0)
          sys.exit(1)")
          xcodebuild test \
            -scheme StashNative \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -quiet

  lint-ios-library:
    name: Lint iOS Library (Clang Static Analyzer)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Static Analysis on iOS Library
        run: |
          # Run Clang Static Analyzer on Objective-C library (generic destination works on any runner)
          cd iOS/StashNative
          xcodebuild analyze \
            -project StashNative.xcodeproj \
            -scheme StashNative \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR=analyzer_results
        continue-on-error: false

  lint-ios-sample:
    name: Lint iOS Sample (SwiftLint)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on Sample
        run: |
          swiftlint lint iOS/Sample/StashNativeSample --strict --config .swiftlint.yml
        continue-on-error: false

  test-desktop-shared:
    name: Test Desktop Shared Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run shared contract tests
        run: |
          cmake -S Desktop/shared -B Desktop/shared-build -DCMAKE_BUILD_TYPE=Release
          cmake --build Desktop/shared-build
          ctest --test-dir Desktop/shared-build --output-on-failure

  lint-macos:
    name: Lint macOS Desktop Host (Clang Static Analyzer)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        working-directory: Desktop
        run: swift build -Xcc -Werror

      - name: Run Static Analysis on macOS host
        run: |
          set -e
          for f in Desktop/macOS/Sources/StashNativeDesktop/*.mm Desktop/shared/*.cpp; do
            clang++ --analyze -x objective-c++ -std=c++17 -fobjc-arc \
              -DSTASH_NATIVE_DESKTOP_BUILDING \
              -I Desktop/include -I Desktop/shared -I Desktop/macOS/Sources/StashNativeDesktop/include \
              -Xanalyzer -analyzer-output=text -Werror "$f"
          done

  test-macos:
    name: Test macOS Desktop Host
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        working-directory: Desktop
        run: swift test

      - name: Build bundle and verify exports
        run: Desktop/macOS/build_bundle.sh
