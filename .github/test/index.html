<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "Factor A";
            src: url("https://checkout.stashstaging.com/_next/static/media/1c7bd21d3a53ff52-s.p.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Factor A";
            src: url("https://checkout.stashstaging.com/_next/static/media/58426b036a50613a-s.p.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Factor A";
            src: url("https://checkout.stashstaging.com/_next/static/media/ce5549b6dc6b2323-s.p.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Factor A Extrabold";
            src: url("https://checkout.stashstaging.com/_next/static/media/48f950569b553d83-s.p.woff2") format("woff2");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light;
            --font-factor-a: "Factor A", system-ui, -apple-system, sans-serif;
            --font-work-sans: "Work Sans", system-ui, -apple-system, sans-serif;
            --pay-ui-theme-primary-color: #424242;
            --pay-ui-theme-primary-hover-color: #424242;
            --pay-ui-theme-primary-gradient: linear-gradient(101deg, #e5ff11 41.9%, #48ff17 94.12%);
            --pay-ui-theme-focus-gradient: linear-gradient(0deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.04)), linear-gradient(90deg, #cee50f 11.06%, #48ff17 35.58%, #00e0ff);
            --pay-ui-theme-fg-primary-color: #1e1e1e;
            --pay-ui-theme-fg-secondary-color: #424242;
            --pay-ui-theme-paper-color: #f7f9f4;
            --pay-ui-theme-paper-gradient: linear-gradient(0deg, rgba(30, 30, 30, 0.02), rgba(30, 30, 30, 0.02)), #f7f9f4;
            --pay-ui-theme-border-color: rgba(30, 30, 30, 0.08);
            --pay-ui-theme-input-bg: #f7f9f4;
            --pay-ui-theme-bg: #ebede8;
            --pay-ui-theme-fg-muted-color: #787878;
            --pay-ui-theme-bg-secondary: #ebede8;
            --pay-ui-theme-sheet-bg: #f7f9f4;
            /* Pay UI neutral pill (checkout eb584c4efc014f52.css :root) */
            --pay-ui-theme-neutral-button-bg: #ffffff;
            --pay-ui-theme-neutral-button-border: rgba(30, 30, 30, 0.08);
            --pay-ui-theme-neutral-button-bg-hover: #f5f5f5;
            --pay-ui-theme-fg-red-color: #df1c41;
            --pay-ui-theme-focus-outline-color: #1e1e1e;
        }

        :root[data-color-scheme="dark"] {
            color-scheme: dark;
            --pay-ui-theme-focus-gradient: linear-gradient(101deg, #e5ff11, #48ff17 50%, #11ffcc);
            --pay-ui-theme-fg-primary-color: #fff;
            --pay-ui-theme-fg-secondary-color: #cccdc9;
            --pay-ui-theme-paper-color: #1e1e1e;
            --pay-ui-theme-paper-gradient: linear-gradient(0deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.02)), #1e1e1e;
            --pay-ui-theme-border-color: rgba(255, 255, 255, 0.08);
            --pay-ui-theme-input-bg: #1e1e1e;
            --pay-ui-theme-bg: #000000;
            --pay-ui-theme-fg-muted-color: #949592;
            --pay-ui-theme-bg-secondary: #000000;
            --pay-ui-theme-sheet-bg: #1e1e1e;
            --pay-ui-theme-neutral-button-bg: #272727;
            --pay-ui-theme-neutral-button-border: rgba(255, 255, 255, 0.08);
            --pay-ui-theme-neutral-button-bg-hover: #323232;
            --pay-ui-theme-focus-outline-color: #ffffff;
        }

        /* Partner / checkout link theme (matches staging sample with ?theme=dark) */
        :root[data-checkout-partner="1"] {
            --pay-ui-theme-bg: #424242;
            --pay-ui-theme-bg-secondary: #424242;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-factor-a);
            font-size: 1rem;
            line-height: 1.375rem;
            font-weight: 400;
            background: var(--pay-ui-theme-bg-secondary);
            color: var(--pay-ui-theme-fg-primary-color);
            min-height: 100dvh;
        }

        .page {
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: var(--pay-ui-theme-bg-secondary);
        }

        .sheet {
            flex: 1;
            position: relative;
            margin-top: -1rem;
            background: var(--pay-ui-theme-sheet-bg);
            border: 1px solid var(--pay-ui-theme-border-color);
            border-radius: 0.75rem 0.75rem 0 0;
        }

        .sheet-inner {
            margin-left: 1rem;
            margin-right: 1rem;
            padding-top: 1.5rem;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .header-title {
            font-family: var(--font-factor-a);
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.3;
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--pay-ui-theme-fg-primary-color);
        }

        .header-close {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            border-radius: 9999px;
            background: transparent;
            color: var(--pay-ui-theme-fg-muted-color);
            cursor: pointer;
            padding: 0;
        }

        .header-close:hover {
            opacity: 0.7;
        }

        .section-title {
            font-family: "Factor A Extrabold", var(--font-factor-a);
            font-weight: 800;
            font-size: 1.25rem;
            line-height: 1;
            letter-spacing: -0.0375rem;
            color: var(--pay-ui-theme-fg-primary-color);
        }

        .section-title-sm {
            font-family: var(--font-factor-a);
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--pay-ui-theme-fg-primary-color);
        }

        .divider {
            border: none;
            border-top: 1px solid var(--pay-ui-theme-border-color);
            margin: 0;
        }

        .field-label {
            display: block;
            font-family: var(--font-work-sans);
            font-weight: 500;
            font-size: 0.875rem;
            line-height: 1.2;
            color: var(--pay-ui-theme-fg-secondary-color);
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            height: 2.25rem;
            padding: 0.5rem 0.75rem;
            font-family: var(--font-factor-a);
            font-size: 0.875rem;
            line-height: 1.4;
            color: var(--pay-ui-theme-fg-primary-color);
            background: var(--pay-ui-theme-input-bg);
            border: 1px solid var(--pay-ui-theme-border-color);
            border-radius: 0.25rem;
            outline: none;
            margin-bottom: 0;
        }

        input[type="text"]::placeholder {
            color: var(--pay-ui-theme-fg-muted-color);
        }

        input[type="text"]:focus {
            border-color: transparent;
            box-shadow: 0 0 0 2px transparent;
            background: var(--pay-ui-theme-input-bg);
        }

        .input-focus-ring:focus {
            outline: none;
            border-color: transparent;
            box-shadow: none;
            position: relative;
        }

        .input-wrap {
            margin-bottom: 1rem;
        }

        /* Gradient ring only around the control — label stays outside this shell */
        .input-focus-shell {
            position: relative;
            display: block;
        }

        .input-focus-shell:focus-within::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 6px;
            background: var(--pay-ui-theme-focus-gradient);
            padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .input-focus-shell input {
            position: relative;
            z-index: 1;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        button.btn {
            box-sizing: border-box;
            width: 100%;
            min-height: 2.5rem;
            /* Vertical centering via flex only — avoids text vs icon baseline drift */
            padding: 0 1rem;
            margin: 0;
            font-family: var(--font-factor-a);
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1;
            /* Checkout mobile: Tailwind rounded-full on payment row controls */
            border-radius: 9999px;
            cursor: pointer;
            border-width: 1px;
            border-style: solid;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            appearance: none;
            -webkit-appearance: none;
        }

        button.btn > svg {
            display: block;
            width: 1.125rem;
            height: 1.125rem;
            flex-shrink: 0;
        }

        button.btn .btn-label {
            display: block;
            line-height: 1;
            text-align: start;
        }

        button.btn:active {
            transform: scale(0.99);
        }

        button.btn-primary {
            background: var(--pay-ui-theme-neutral-button-bg);
            color: var(--pay-ui-theme-fg-primary-color);
            border-color: var(--pay-ui-theme-neutral-button-border);
        }

        button.btn-primary:hover {
            background: var(--pay-ui-theme-neutral-button-bg-hover);
        }

        button.btn-danger {
            background: transparent;
            color: var(--pay-ui-theme-fg-red-color);
            border-color: rgba(223, 28, 65, 0.45);
        }

        :root[data-color-scheme="light"] button.btn-danger {
            border-color: rgba(223, 28, 65, 0.35);
        }

        .legal {
            font-family: var(--font-work-sans);
            font-weight: 400;
            font-size: 0.75rem;
            line-height: 1.4;
            text-align: center;
            color: var(--pay-ui-theme-fg-secondary-color);
        }

        .legal strong {
            font-weight: 600;
            color: var(--pay-ui-theme-fg-primary-color);
        }

        .powered {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .powered-label {
            font-family: var(--font-factor-a);
            font-weight: 500;
            font-size: 10px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: uppercase;
            color: var(--pay-ui-theme-fg-muted-color);
        }

        .powered svg {
            display: block;
            color: var(--pay-ui-theme-fg-primary-color);
        }

        .status-panel {
            font-family: var(--font-work-sans);
            font-size: 0.75rem;
            line-height: 1.4;
            color: var(--pay-ui-theme-fg-secondary-color);
            text-align: center;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--pay-ui-theme-border-color);
            background: var(--pay-ui-theme-paper-gradient);
        }

        .meta-hint {
            font-family: var(--font-work-sans);
            font-size: 0.6875rem;
            line-height: 1.35;
            color: var(--pay-ui-theme-fg-muted-color);
            text-align: center;
        }

        .stack-gap-sm {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stack-gap-md {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .collapsible-section-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 0;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .collapsible-section-toggle:hover {
            opacity: 0.85;
        }

        .collapsible-section-toggle .section-title-sm {
            margin: 0;
        }

        .collapsible-chevron {
            display: block;
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
            color: var(--pay-ui-theme-fg-muted-color);
            transition: transform 0.2s ease;
        }

        .collapsible-section:not(.collapsible-section--open) .collapsible-chevron {
            transform: rotate(-90deg);
        }

        .collapsible-section-panel {
            margin-top: 0.5rem;
        }

        .collapsible-section:not(.collapsible-section--open) .collapsible-section-panel {
            display: none;
        }

        .input-focus-shell:focus-within input {
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="sheet">
            <div class="sheet-inner">
                <div class="header-row">
                    <h1 class="header-title">Test Card</h1>
                    <button type="button" class="header-close" aria-label="Close" onclick="window.close()">
                        <svg fill="none" height="16" viewBox="0 0 14 14" width="16" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.75 0.75L0.75 12.75M0.75 0.75L12.75 12.75" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
                        </svg>
                    </button>
                </div>

                <div class="stack-gap-md">
                    <div class="input-wrap">
                        <label class="field-label" for="sample-input">Keyboard Input Test</label>
                        <div class="input-focus-shell">
                            <input type="text" id="sample-input" class="input-focus-ring" placeholder="Sample text input" />
                        </div>
                    </div>
                    <div class="btn-stack">
                        <button type="button" class="btn btn-primary" onclick="triggerSuccess()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                            <span class="btn-label">Payment Success</span>
                        </button>
                        <button type="button" class="btn btn-primary" onclick="triggerFailure()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
                            <span class="btn-label">Payment Failure</span>
                        </button>
                        <button type="button" class="btn btn-primary" onclick="triggerProcessing()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            <span class="btn-label">Purchase Processing</span>
                        </button>
                        <button type="button" class="btn btn-primary" onclick="triggerProcessingCompleted()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="M22 4 12 14.01l-3-3"/></svg>
                            <span class="btn-label">Processing Completed</span>
                        </button>
                        <button type="button" class="btn btn-primary" onclick="triggerExpand()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                            <span class="btn-label">Expand</span>
                        </button>
                        <button type="button" class="btn btn-primary" onclick="triggerCollapse()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9H3v6M15 15h6v-6M21 9l-6 6M3 15l6-6"/></svg>
                            <span class="btn-label">Collapse</span>
                        </button>
                    </div>
                </div>

                <hr class="divider" />

                <div class="stack-gap-md">
                    <span class="section-title-sm">External payment</span>
                    <div class="input-wrap">
                        <label class="field-label" for="externalUrl">URL</label>
                        <div class="input-focus-shell">
                            <input type="text" id="externalUrl" class="input-focus-ring" placeholder="https://example.com" value="https://example.com" />
                        </div>
                    </div>
                    <div class="btn-stack">
                        <button type="button" class="btn btn-primary" onclick="triggerExternal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
                            <span class="btn-label">External payment</span>
                        </button>
                    </div>
                </div>

                <hr class="divider" />

                <div id="exception-tests-section" class="stack-gap-sm collapsible-section">
                    <button type="button" class="collapsible-section-toggle" id="exception-tests-heading" aria-expanded="false" aria-controls="exception-tests-panel">
                        <span class="section-title-sm">Exception tests</span>
                        <svg class="collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div id="exception-tests-panel" class="collapsible-section-panel" role="region" aria-labelledby="exception-tests-heading">
                    <div class="btn-stack">
                    <button type="button" class="btn btn-danger" onclick="triggerJSError()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>
                            <span class="btn-label">Throw JavaScript Error</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerMemoryLeak()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                            <span class="btn-label">Memory Leak Test</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerInfiniteLoop()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
                            <span class="btn-label">Infinite Loop (May Freeze)</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerLargeDOM()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            <span class="btn-label">Create Large DOM</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerInvalidAPICall()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
                            <span class="btn-label">Invalid SDK Call</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerUncaughtPromise()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                            <span class="btn-label">Uncaught Promise</span>
                        </button>
                    <button type="button" class="btn btn-danger" onclick="triggerRecursiveError()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
                            <span class="btn-label">Recursive Error</span>
                        </button>
                    </div>
                    </div>
                </div>

                <div class="powered">
                    <span class="powered-label">Powered by</span>
                    <div aria-hidden="true">
                        <svg fill="none" height="21" viewBox="0 0 80 21" width="80" xmlns="http://www.w3.org/2000/svg">

                <div id="status" class="status-panel">Ready</div>
                <div id="theme-info" class="meta-hint"></div>
                <div id="user-agent-info" class="meta-hint"></div>
            </div>
        </div>
    </div>

    <script>
        function getThemeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme');
            return theme ? theme.toLowerCase() : null;
        }

        function applyTheme() {
            const theme = getThemeFromURL();
            const html = document.documentElement;
            const body = document.body;

            html.removeAttribute('data-color-scheme');
            html.removeAttribute('data-checkout-partner');
            body.classList.remove('theme-dark', 'theme-light');

            if (theme === 'dark') {
                html.setAttribute('data-color-scheme', 'dark');
                html.setAttribute('data-checkout-partner', '1');
                body.classList.add('theme-dark');
            } else if (theme === 'light') {
                html.setAttribute('data-color-scheme', 'light');
                body.classList.add('theme-light');
            } else {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.setAttribute('data-color-scheme', prefersDark ? 'dark' : 'light');
            }
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function updateThemeInfo() {
            const theme = getThemeFromURL();
            const systemIsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            let themeText = '';
            if (theme) {
                themeText = 'URL theme: ' + theme.charAt(0).toUpperCase() + theme.slice(1);
            } else {
                themeText = 'System: ' + (systemIsDark ? 'Dark' : 'Light') + ' (no theme param)';
            }
            document.getElementById('theme-info').textContent = themeText;
        }

        function updateUserAgentInfo() {
            const userAgent = navigator.userAgent || 'Unknown';
            document.getElementById('user-agent-info').textContent = 'User agent: ' + userAgent;
        }

        applyTheme();
        updateThemeInfo();
        updateUserAgentInfo();

        (function initExceptionTestsCollapsible() {
            var section = document.getElementById('exception-tests-section');
            var toggle = document.getElementById('exception-tests-heading');
            if (!section || !toggle) return;
            toggle.addEventListener('click', function () {
                var open = section.classList.toggle('collapsible-section--open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        })();

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                if (!getThemeFromURL()) {
                    applyTheme();
                    updateThemeInfo();
                }
            });
        }

        function triggerSuccess() {
            updateStatus('Called: onPaymentSuccess({})');
            if (window.stash_sdk && window.stash_sdk.onPaymentSuccess) {
                window.stash_sdk.onPaymentSuccess({ orderId: 'test_order_id' });
            }
        }

        function triggerFailure() {
            updateStatus('Called: onPaymentFailure()');
            if (window.stash_sdk && window.stash_sdk.onPaymentFailure) {
                window.stash_sdk.onPaymentFailure({});
            }
        }

        function triggerProcessing() {
            updateStatus('Called: onPurchaseProcessing()');
            if (window.stash_sdk && window.stash_sdk.onPurchaseProcessing) {
                window.stash_sdk.onPurchaseProcessing({});
            }
        }

        function triggerProcessingCompleted() {
            updateStatus('Called: onProcessingCompleted()');
            if (window.stash_sdk && window.stash_sdk.onProcessingCompleted) {
                window.stash_sdk.onProcessingCompleted({});
            }
        }

        function triggerExpand() {
            updateStatus('Called: expand()');
            if (window.stash_sdk && window.stash_sdk.expand) {
                window.stash_sdk.expand();
            }
        }

        function triggerCollapse() {
            updateStatus('Called: collapse()');
            if (window.stash_sdk && window.stash_sdk.collapse) {
                window.stash_sdk.collapse();
            }
        }

        function triggerExternal() {
            var el = document.getElementById('externalUrl');
            var url = (el && el.value && el.value.trim()) ? el.value.trim() : 'https://example.com';
            if (window.stash_sdk && typeof window.stash_sdk.openExternalBrowser === 'function') {
                updateStatus('Called: openExternalBrowser("' + url + '")');
                try {
                    window.stash_sdk.openExternalBrowser(url);
                } catch (e) {
                    updateStatus('openExternalBrowser() error: ' + (e && e.message ? e.message : e));
                }
            } else {
                updateStatus('stash_sdk.openExternalBrowser not available (requires native Stash SDK)');
            }
        }

        function triggerJSError() {
            updateStatus('Throwing JavaScript Error...');
            try {
                throw new Error('Test JavaScript Error - This should be caught by native exception handler');
            } catch (e) {
                updateStatus('Error caught: ' + e.message);
                throw e;
            }
        }

        function triggerMemoryLeak() {
            updateStatus('Creating memory leak...');
            window.memoryLeakArray = window.memoryLeakArray || [];
            for (let i = 0; i < 100000; i++) {
                window.memoryLeakArray.push(new Array(1000).fill(Math.random()));
            }
            updateStatus('Created ~100MB of data. Repeat to increase memory usage.');
        }

        function triggerInfiniteLoop() {
            updateStatus('Starting infinite loop (may freeze browser)...');
            while (true) {
                Math.random();
            }
        }

        function triggerLargeDOM() {
            updateStatus('Creating large DOM structure...');
            const container = document.querySelector('.sheet-inner');
            for (let i = 0; i < 10000; i++) {
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.margin = '2px';
                div.style.backgroundColor = 'rgba(255, 0, 0, 0.1)';
                div.textContent = 'DOM Element ' + i;
                container.appendChild(div);
            }
            updateStatus('Created 10,000 DOM elements');
        }

        function triggerInvalidAPICall() {
            updateStatus('Calling invalid SDK method...');
            try {
                if (window.stash_sdk) {
                    if (window.stash_sdk.onPaymentSuccess) {
                        window.stash_sdk.onPaymentSuccess(null);
                        window.stash_sdk.onPaymentSuccess(undefined);
                        window.stash_sdk.onPaymentSuccess('invalid');
                        window.stash_sdk.onPaymentSuccess({ invalid: 'data', nested: { deep: { very: { deep: { object: 'test' } } } } });
                    }
                    if (window.stash_sdk.nonExistentMethod) {
                        window.stash_sdk.nonExistentMethod();
                    }
                } else {
                    window.stash_sdk.invalidMethod();
                }
                updateStatus('Invalid API calls attempted');
            } catch (e) {
                updateStatus('Error: ' + e.message);
                throw e;
            }
        }

        function triggerUncaughtPromise() {
            updateStatus('Creating uncaught promise rejection...');
            Promise.reject(new Error('Uncaught Promise Rejection - Test Error'));
            (async function () {
                await new Promise(function (resolve) { setTimeout(resolve, 100); });
                throw new Error('Async function error');
            })();
            updateStatus('Uncaught promise created');
        }

        function triggerRecursiveError() {
            updateStatus('Triggering recursive error...');
            function recursiveFunction(depth) {
                if (depth > 1000) {
                    throw new Error('Stack overflow - recursive error at depth ' + depth);
                }
                return recursiveFunction(depth + 1);
            }
            try {
                recursiveFunction(0);
            } catch (e) {
                updateStatus('Recursive error: ' + e.message);
                throw e;
            }
        }

        const originalConsoleError = console.error;
        console.error = function () {
            originalConsoleError.apply(console, arguments);
            updateStatus('Console Error: ' + Array.prototype.join.call(arguments, ' '));
        };

        window.addEventListener('unhandledrejection', function (event) {
            updateStatus('Unhandled Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
        });

        window.addEventListener('error', function (event) {
            updateStatus('Global Error: ' + (event.message || 'Unknown error'));
        });
    </script>
