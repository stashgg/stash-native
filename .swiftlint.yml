# Aggressive production-use rules for Stash Native
opt_in_rules:
  - force_cast
  - force_try
  - force_unwrapping

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

# Fail on violations (strict)
strict: true

# Paths (optional; workflow passes --path)
excluded:
  - .build
  - DerivedData
  - Carthage
  - Pods
