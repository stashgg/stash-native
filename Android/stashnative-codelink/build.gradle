apply plugin: 'com.android.library'

// Optional QR Code Linking module. Hosts that never scan omit it and ship no camera code.
android {
    namespace 'com.stash.stashnative.codelink'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    // compileOnly: raw AAR consumers add the core AAR themselves, so this module must not
    // re-export it. The core resolves com.stash.stashnative.codelink.StashScannerSupport at runtime.
    compileOnly project(':stashnative')
    // implementation: a file-based AAR carries no Maven metadata, so AAR hosts add these four
    // libraries explicitly alongside the module.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation project(':stashnative')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
