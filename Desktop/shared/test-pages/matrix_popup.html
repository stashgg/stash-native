<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><style>
  body { font-family: "Segoe UI", -apple-system, sans-serif; background: #101216; color: #cbd2dc;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         height: 96vh; margin: 0; font-size: 13px; }
  b { color: #f2f3f5; font-size: 15px; }
  .ok { color: #4ade80; margin-top: 8px; }
</style></head>
<body>
  <b>PSP payment popup</b>
  <div id="s">Completing payment...</div>
<script>
  // Simulates the PayPal-style popup leg: complete, notify the opener, close self.
  setTimeout(() => {
    document.getElementById('s').innerHTML = '<span class="ok">Done, returning to checkout</span>';
    if (window.opener) window.opener.postMessage({ popupResult: 'ok' }, '*');
    setTimeout(() => window.close(), 500);
  }, 900);
</script>
</body>
</html>
