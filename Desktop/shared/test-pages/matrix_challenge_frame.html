<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><style>
  body { font-family: "Segoe UI", -apple-system, sans-serif; background: #101216; color: #cbd2dc;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         height: 96vh; margin: 0; font-size: 12px; }
  b { color: #f2f3f5; font-size: 13px; }
  .ok { color: #4ade80; margin-top: 6px; }
</style></head>
<body>
  <b>Bank challenge frame</b>
  <div id="s">Verifying it's you...</div>
<script>
  // Simulates a 3DS2 ACS challenge completing and notifying the merchant page.
  setTimeout(() => {
    document.getElementById('s').innerHTML = '<span class="ok">Approved</span>';
    parent.postMessage({ challenge: 'ok' }, '*');
  }, 900);
</script>
</body>
</html>
