apply plugin: 'com.android.library'

android {
    namespace 'com.stash.stashnative'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Release validation must fail when Android Lint reports errors.
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    // api: Gradle consumers inherit the dependency; compat helpers still support older Core at runtime (Unity).
    api 'androidx.core:core:1.12.0'
    // Optional at runtime: CCT via reflection in StashUrlLauncher; hosts need not bundle browser.
    compileOnly 'androidx.browser:browser:1.7.0'
    // Keeps WebView algorithmic darkening from changing checkout/payment iframe colors.
    api 'androidx.webkit:webkit:1.11.0'

    testImplementation 'androidx.browser:browser:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
